<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plainly — speak messy, read clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#ECEEF1; --surface:#FFFFFF; --ink:#16181D; --muted:#6B7280;
    --line:#E1E4E8; --indigo:#4B3BEB; --indigo-soft:#EEECFE;
    --amber:#F0A020; --amber-soft:#FDF1DC; --ok:#1F9D6B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",system-ui,sans-serif; background:var(--canvas);
    color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:18px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:560px}

  header{margin:6px 2px 18px}
  .word{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:30px; letter-spacing:-.02em; line-height:1}
  .word .dot{color:var(--indigo)}
  .tag{color:var(--muted); font-size:13px; margin-top:5px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}

  .cardlabel{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
  .cardlabel .pip{width:7px; height:7px; border-radius:50%; background:var(--line)}

  /* capture */
  .caprow{display:flex; align-items:center; gap:14px}
  .mic{
    flex:0 0 auto; width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
    background:var(--indigo); color:#fff; display:grid; place-items:center; transition:transform .12s, background .2s;
  }
  .mic:hover{transform:scale(1.04)}
  .mic:active{transform:scale(.96)}
  .mic svg{width:26px; height:26px}
  .mic.live{background:var(--amber); animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,160,32,.45)}70%{box-shadow:0 0 0 14px rgba(240,160,32,0)}100%{box-shadow:0 0 0 0 rgba(240,160,32,0)}}
  .capmeta{min-width:0}
  .capstate{font-size:14px; font-weight:600}
  .caphint{font-size:12.5px; color:var(--muted); margin-top:2px}

  .wave{display:flex; align-items:flex-end; gap:3px; height:22px; margin-top:12px; opacity:0; transition:opacity .25s}
  .wave.on{opacity:1}
  .wave span{width:3px; background:var(--amber); border-radius:2px; height:20%; animation:bounce 1s infinite ease-in-out}
  .wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}
  .wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.15s}
  .wave span:nth-child(6){animation-delay:.25s}.wave span:nth-child(7){animation-delay:.05s}
  @keyframes bounce{0%,100%{height:20%}50%{height:100%}}

  textarea{
    width:100%; border:none; resize:vertical; background:transparent; color:var(--ink);
    font-family:"JetBrains Mono",monospace; font-size:13.5px; line-height:1.6; min-height:96px; margin-top:12px;
  }
  textarea:focus{outline:none}
  textarea::placeholder{color:#AEB4BD}

  /* tone chips */
  .tones{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 14px}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:inherit; font-size:13px; font-weight:500; padding:7px 13px; border-radius:20px; cursor:pointer; transition:all .15s}
  .chip:hover{border-color:#C7CCD3}
  .chip.sel{background:var(--indigo); border-color:var(--indigo); color:#fff}

  .polish{
    width:100%; border:none; border-radius:12px; background:var(--indigo); color:#fff;
    font-family:inherit; font-size:15px; font-weight:600; padding:14px; cursor:pointer; transition:opacity .2s, transform .12s;
    display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .polish:hover{opacity:.93}
  .polish:active{transform:scale(.99)}
  .polish:disabled{opacity:.5; cursor:default; transform:none}
  .spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* output */
  .out{border-color:var(--indigo-soft); background:linear-gradient(180deg,#FCFCFF, #FFFFFF)}
  .out.empty .outbody{color:#AEB4BD; font-size:14px}
  .outbody{font-size:15.5px; line-height:1.62; white-space:pre-wrap; min-height:24px}
  .outfoot{display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
  .count{font-size:12px; color:var(--muted)}
  .copy{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:9px; cursor:pointer; transition:all .15s}
  .copy:hover{border-color:#C7CCD3}
  .copy.done{background:var(--ok); border-color:var(--ok); color:#fff}

  .err{color:#C23B3B; font-size:13px; margin-top:10px; display:none}

  footer{text-align:center; color:#9AA1AB; font-size:11.5px; margin:6px 0 4px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="word">Plainly<span class="dot">.</span></div>
    <div class="tag">Speak messy. Read clean. — a working prototype</div>
  </header>

  <!-- CAPTURE -->
  <div class="card">
    <div class="cardlabel"><span class="pip" id="pip"></span> Raw capture</div>
    <div class="caprow">
      <button class="mic" id="mic" aria-label="Start recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="capmeta">
        <div class="capstate" id="capstate">Tap to talk</div>
        <div class="caphint" id="caphint">or type / paste your rough words below</div>
      </div>
    </div>
    <div class="wave" id="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <textarea id="raw" placeholder="e.g. um so yeah i was thinking like maybe we could uh do the thing on tuesday, no wait wednesday..."></textarea>
  </div>

  <!-- TONE -->
  <div class="cardlabel" style="margin:0 2px 10px">Polish it as</div>
  <div class="tones" id="tones">
    <button class="chip sel" data-tone="a clear, professional message">Professional</button>
    <button class="chip" data-tone="a friendly, casual message">Casual</button>
    <button class="chip" data-tone="the shortest clear version, trimmed to essentials">Concise</button>
    <button class="chip" data-tone="a quick text message to a mate">Text</button>
  </div>

  <button class="polish" id="polish">
    <span class="spin" id="spin"></span>
    <span id="polishlabel">Polish my words</span>
  </button>
  <div class="err" id="err"></div>

  <!-- OUTPUT -->
  <div class="card out empty" id="out" style="margin-top:14px">
    <div class="cardlabel"><span class="pip" style="background:var(--indigo)"></span> Clean version</div>
    <div class="outbody" id="outbody">Your polished text will appear here.</div>
    <div class="outfoot" id="outfoot" style="display:none">
      <span class="count" id="count"></span>
      <button class="copy" id="copy">Copy</button>
    </div>
  </div>

  <footer>Prototype — the AI cleanup engine only. Live mic uses your browser's speech recognition where available.</footer>

</div>

<script>
  const $ = id => document.getElementById(id);
  let tone = "a clear, professional message";

  // ---- tone chips ----
  $("tones").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
    b.classList.add("sel"); tone = b.dataset.tone;
  });

  // ---- speech recognition (graceful fallback) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, baseText = "";

  if(!SR){
    $("caphint").textContent = "Live mic isn't available in this browser — type or paste below, Polish still works.";
    $("mic").style.background = "#C7CCD3";
    $("mic").style.cursor = "default";
  } else {
    rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = "en-AU";
    rec.onresult = e => {
      let interim = "", final = "";
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) final += t; else interim += t;
      }
      if(final) baseText = (baseText + " " + final).trim();
      $("raw").value = (baseText + " " + interim).trim();
    };
    rec.onerror = () => stopListening();
    rec.onend = () => { if(listening){ try{rec.start();}catch(_){}} };
  }

  function startListening(){
    if(!SR) return;
    baseText = $("raw").value.trim();
    try{ rec.start(); }catch(_){}
    listening = true;
    $("mic").classList.add("live");
    $("mic").setAttribute("aria-label","Stop recording");
    $("capstate").textContent = "Listening…";
    $("caphint").textContent = "Tap again to stop";
    $("wave").classList.add("on");
    $("pip").style.background = "var(--amber)";
  }
  function stopListening(){
    listening = false;
    try{ rec && rec.stop(); }catch(_){}
    $("mic").classList.remove("live");
    $("capstate").textContent = "Tap to talk";
    $("caphint").textContent = "or type / paste your rough words below";
    $("wave").classList.remove("on");
    $("pip").style.background = "var(--line)";
  }
  $("mic").addEventListener("click", ()=> listening ? stopListening() : startListening());

  // ---- polish (calls Claude) ----
  $("polish").addEventListener("click", async () => {
    const raw = $("raw").value.trim();
    $("err").style.display = "none";
    if(!raw){ $("err").textContent = "Say or type something first."; $("err").style.display="block"; return; }
    if(listening) stopListening();

    setBusy(true);
    try{
      const res = await fetch("/api/polish", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ raw, tone })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || ("Request failed ("+res.status+")"));
      if(!data.text) throw new Error("Empty response");
      showOutput(data.text);
    }catch(err){
      $("err").textContent = "Couldn't polish that — "+err.message+". Give it another go.";
      $("err").style.display = "block";
    }finally{
      setBusy(false);
    }
  });

  function setBusy(on){
    $("polish").disabled = on;
    $("spin").style.display = on ? "block" : "none";
    $("polishlabel").textContent = on ? "Polishing…" : "Polish my words";
  }

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function showOutput(text){
    const out = $("out"), body = $("outbody");
    out.classList.remove("empty");
    $("outfoot").style.display = "flex";
    const words = text.trim().split(/\s+/).length;
    $("count").textContent = words + (words===1?" word":" words");
    $("copy").classList.remove("done"); $("copy").textContent = "Copy";

    if(reduce){ body.textContent = text; return; }
    body.textContent = "";
    let i = 0;
    (function type(){
      if(i > text.length) return;
      body.textContent = text.slice(0, i);
      i += Math.max(2, Math.round(text.length/90));
      requestAnimationFrame(()=>setTimeout(type, 8));
    })();
  }

  $("copy").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText($("outbody").textContent);
      $("copy").textContent = "Copied"; $("copy").classList.add("done");
      setTimeout(()=>{ $("copy").textContent="Copy"; $("copy").classList.remove("done"); }, 1600);
    }catch(_){}
  });
</script>
</body>
</html>
